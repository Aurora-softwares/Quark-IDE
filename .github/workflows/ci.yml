name: Hydrogen IDE contracts
on:
  push:
    branches: [Development]
  pull_request:
    branches: [Development]
jobs:
  source-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate native UI schema XML and source integration contracts
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Verify every shipped feature has at least two tests
        run: python3 scripts/check-feature-coverage.py

  native-gtk-integration:
    name: Build and interact with both Hydrogen GTK4 windows
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Aurora-softwares/Hylang-Compiler
          ref: Development
          path: hydrogen
      - name: Install native GTK4 build and virtual desktop requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake binutils pkg-config libgtk-4-dev xvfb dbus-x11 file python3
      - name: Bootstrap a real Hydrogen Stage 1
        run: |
          cmake -S hydrogen -B hydrogen/build/bootstrap -DCMAKE_BUILD_TYPE=Release -DHYDROGEN_BUILD_UI=OFF
          cmake --build hydrogen/build/bootstrap --target hy --parallel 3
          mkdir -p hydrogen/build/self_hosting/linux
          (cd hydrogen && ./build/bootstrap/hy build src/Hydrogen.Compiler.Cli/Hydrogen.Compiler.Cli.hyproj -o build/self_hosting/linux/hydrogen-stage1)
      - name: Build Quark and exercise native GTK4 lifecycle/events
        env:
          HY: ${{ github.workspace }}/hydrogen/build/self_hosting/linux/hydrogen-stage1
          HYUI_NATIVE_UI_SMOKE: "1"
        run: |
          dbus-run-session -- xvfb-run -a -s '-screen 0 1600x1200x24' \
            bash tests/native-smoke.sh

  native-apple-silicon:
    name: Build and launch both Hydrogen AppKit windows on Apple Silicon
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Aurora-softwares/Hylang-Compiler
          ref: Development
          path: hydrogen
      - name: Build Apple Silicon Hydrogen and native AppKit runtime
        run: |
          test "$(uname -m)" = arm64
          brew install qtbase
          cmake -S hydrogen -B hydrogen/build/arm64 -DCMAKE_BUILD_TYPE=Release \
            -DHYDROGEN_BUILD_UI=ON -DCMAKE_PREFIX_PATH="$(brew --prefix qtbase)"
          cmake --build hydrogen/build/arm64 --target hy hyui hydrogen-ui-sdk --parallel 3
      - name: Build Quark Start and IDE as arm64 AppKit bundles
        run: |
          HY="$PWD/hydrogen/build/arm64/hy" \
            HYUI_RUNTIME_ROOT="$PWD/hydrogen/build/arm64/native-sdk" \
            bash scripts/build.sh
          for app in Quark QuarkIDE; do
            bundle="build/$app.app/Contents"
            test -f "$bundle/hyui-runtime.json"
            lipo -archs "$bundle/MacOS/hyui" | grep -qx arm64
            lipo -archs "$bundle/MacOS/hyui-launcher" | grep -qx arm64
            lipo -archs "$bundle/Resources/app/__hyui_backend" | grep -qx arm64
            plutil -lint "$bundle/Info.plist"
          done
      - name: Exercise Quark Apple Silicon Build and Run with the real compiler
        run: |
          hydrogen/build/arm64/hy build Quark.ArmTargetTests.hyproj \
            -o build/quark-arm-target-tests --hide-progress --hide-spinner --hide-log
          mkdir -p build/arm-target-fixture
          build/quark-arm-target-tests "$PWD/hydrogen/build/arm64/hy" "$PWD/build/arm-target-fixture"
          lipo -archs build/arm-target-fixture/App.hyproj.quark-build | grep -qx arm64
      - name: Launch both native Quark windows
        run: |
          python3 - <<'PY'
          import os, signal, subprocess, time
          for name in ('Quark', 'QuarkIDE'):
              launcher = f'build/{name}.app/Contents/MacOS/hyui-launcher'
              app = subprocess.Popen([launcher], stderr=subprocess.PIPE, start_new_session=True)
              try:
                  time.sleep(4)
                  if app.poll() is not None:
                      raise AssertionError(f'{name} exited early ({app.returncode}): {app.stderr.read().decode()}')
              finally:
                  if app.poll() is None:
                      os.killpg(app.pid, signal.SIGTERM)
                      app.wait(timeout=10)
          PY
