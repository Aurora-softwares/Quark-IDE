name: Quark CI
on:
  push:
    branches: [Development]
  pull_request:
  workflow_dispatch:
concurrency:
  group: quark-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libgl1-mesa-dev libgtk-4-dev libadwaita-1-dev
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Lints
        run: cargo clippy --no-default-features --features legacy-ui --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --no-default-features --features legacy-ui --all-targets
      - name: Feature coverage policy
        run: |
          python -m unittest discover -s scripts -p test_feature_coverage.py
          python scripts/check-feature-coverage.py
      - name: Release compilation
        run: cargo build --release --no-default-features --features legacy-ui --bin quark-ide
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: quark-legacy-${{ runner.os }}
          path: |
            target/release/quark-ide
            target/release/quark-ide.exe
          if-no-files-found: error

  native-frontend:
    name: native UI (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: GTK4 and libadwaita build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libgtk-4-dev libadwaita-1-dev xvfb xauth xdotool
      - name: Verify native UI frontend
        run: cargo clippy --no-default-features --features native-ui --bin quark-native -- -D warnings
      - name: Native UI model tests
        run: cargo test --no-default-features --features native-ui --bin quark-native
      - name: Build native UI frontend
        run: cargo build --release --no-default-features --features native-ui --bin quark-native
      - name: AppKit startup lifetime on macOS
        if: runner.os == 'macOS'
        run: python3 scripts/macos-startup-smoke.py target/release/quark-native
      - name: Package macOS AppKit application
        if: runner.os == 'macOS'
        run: bash scripts/package-macos-app.sh target/release/quark-native dist
      - name: Validate macOS application bundle and restored executable
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist/check-unzip
          ditto -x -k dist/Quark-IDE-macOS.zip dist/check-unzip
          test -x "dist/check-unzip/Quark IDE.app/Contents/MacOS/quark-native"
          plutil -lint "dist/check-unzip/Quark IDE.app/Contents/Info.plist"
          codesign --verify --strict "dist/check-unzip/Quark IDE.app"
      - name: Upload Finder-ready macOS application
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: quark-macos-app
          path: dist/Quark-IDE-macOS.zip
          if-no-files-found: error
      - name: GTK startup lifetime under Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run -a -s '-screen 0 1600x1000x24' python3 scripts/native-startup-smoke.py target/release/quark-native
      - name: Native GTK stacked docking ownership regression under Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run -a -s '-screen 0 1600x1000x24' env G_DEBUG=fatal-warnings GTK_A11Y=none cargo test --no-default-features --features native-ui --bin quark-native moved_stacks_reparent_without_gtk_non_child_warnings -- --ignored --test-threads=1
      - name: Native GTK SizeBin parent regression under Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run -a -s '-screen 0 1600x1000x24' env G_DEBUG=fatal-warnings GTK_A11Y=none cargo test --no-default-features --features native-ui --bin quark-native native_sizing_wrappers_move_without_detaching_the_inner_widget -- --ignored --test-threads=1
      - name: Native GTK Hydrogen designer menu layout under Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run -a -s '-screen 0 1600x1000x24' env G_DEBUG=fatal-warnings GTK_A11Y=none cargo test --no-default-features --features native-ui --bin quark-native gtk_design_menu_bar_is_one_horizontal_row_with_natural_size_buttons -- --ignored --test-threads=1
      - name: Native GTK Hydrogen designer panel structure under Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run -a -s '-screen 0 1600x1000x24' env G_DEBUG=fatal-warnings GTK_A11Y=none cargo test --no-default-features --features native-ui --bin quark-native gtk_design_panel_uses_actual_native_frame_and_inner_margins -- --ignored --test-threads=1
      - name: Native GTK Solution Explorer context-menu ownership regression under Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run -a -s '-screen 0 1600x1000x24' env G_DEBUG=fatal-warnings GTK_A11Y=none cargo test --no-default-features --features native-ui --bin quark-native context_menu_does_not_poison_listbox_row_rebuild -- --ignored --test-threads=1
      - uses: actions/upload-artifact@v4
        with:
          name: quark-native-${{ runner.os }}
          path: |
            target/release/quark-native
            target/release/quark-native.exe
          if-no-files-found: error
