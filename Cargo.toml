[package]
name = "quark-ide"
version = "0.6.0"
edition = "2021"
license = "MIT"
description = "Native Hydrogen development environment"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"], optional = true }
egui_extras = { version = "0.31", features = ["syntect"], optional = true }
rfd = { version = "0.15", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = { version = "0.38", features = ["serialize"] }
roxmltree = "0.20"
toml = "0.8"
tempfile = "3"
naui = { version = "=0.8.0", optional = true }
portable-pty = "0.9"
vt100 = "0.18"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", features = ["NSTextView", "NSTextStorage", "NSColor", "NSFont", "NSAttributedString"] }
objc2-foundation = { version = "0.3", features = ["NSRange", "NSString"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
gtk4 = { version = "0.9", optional = true }
libadwaita = { version = "0.7", optional = true }

[profile.release]
lto = "thin"
strip = true


[features]
# The supported application is always the OS-native frontend.
# The previous egui application is isolated for regression/migration only.
default = ["native-ui"]
native-ui = ["dep:naui", "dep:gtk4", "dep:libadwaita", "dep:rfd"]
legacy-ui = ["dep:eframe", "dep:egui_extras", "dep:rfd"]

[[bin]]
name = "quark-ide"
path = "src/main.rs"
required-features = ["legacy-ui"]

[[bin]]
name = "quark-native"
path = "src/bin/quark-native.rs"
required-features = ["native-ui"]
