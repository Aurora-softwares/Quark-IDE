[package]
name = "quark-ide"
version = "0.6.0"
edition = "2021"
license = "MIT"
description = "Native Hydrogen development environment"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui_extras = { version = "0.31", features = ["syntect"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = { version = "0.38", features = ["serialize"] }
toml = "0.8"
tempfile = "3"
naui = { version = "=0.8.0", optional = true }
portable-pty = "0.9"
vt100 = "0.18"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
gtk4 = { version = "0.9", optional = true }

[profile.release]
lto = "thin"
strip = true


[features]
default = []
native-ui = ["dep:naui", "dep:gtk4"]

[[bin]]
name = "quark-ide"
path = "src/main.rs"

[[bin]]
name = "quark-native"
path = "src/bin/quark-native.rs"
required-features = ["native-ui"]
